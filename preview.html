<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apurva's Dental &bull; Live Website Preview Hub</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .device-shadow {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 font-sans antialiased">
  <div class="max-w-7xl mx-auto space-y-5">

    <!-- HEADER & STATUS BAR -->
    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 backdrop-blur-xl">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-xl bg-teal-500/20 border border-teal-500/40 flex items-center justify-center text-teal-400 font-bold text-xl">
          🦷
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2.5">
            Apurva's Dental
            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              3D Studio Active on localhost:8080
            </span>
          </h1>
          <p class="text-xs md:text-sm text-slate-400">Interactive live preview portal &bull; High-precision 3D Dental Anatomy Studio</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 w-full sm:w-auto">
        <a href="http://localhost:8080/tooth-model.html" target="_blank" rel="noopener" class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold transition-all shadow-lg shadow-teal-900/30">
          <span>Open Full 3D Studio</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
        </a>
      </div>
    </header>

    <!-- QUICK PAGE SWITCHER BAR -->
    <nav class="flex flex-wrap items-center gap-2 bg-slate-900/70 border border-slate-800 rounded-xl p-2.5">
      <button onclick="setPreviewUrl('http://localhost:8080/index.html', this)" class="page-tab active px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium bg-teal-600 text-white transition-all shadow-sm">
        🏠 Home Page
      </button>
      <button onclick="setPreviewUrl('http://localhost:8080/index.html#testimonials', this)" class="page-tab px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-all">
        💬 10 Testimonials Stream
      </button>
      <button onclick="setPreviewUrl('http://localhost:8080/tooth-model.html', this)" class="page-tab px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-all">
        🦷 3D Tooth Simulator
      </button>
      <button onclick="setPreviewUrl('http://localhost:8080/services.html', this)" class="page-tab px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-all">
        ✨ Services Overview
      </button>
      <button onclick="setPreviewUrl('http://localhost:8080/services-details.html', this)" class="page-tab px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-all">
        🔬 Procedure Details
      </button>
      <button onclick="setPreviewUrl('http://localhost:8080/doctor-details.html', this)" class="page-tab px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-all">
        👨‍⚕️ Doctors Portfolio
      </button>
      <button onclick="setPreviewUrl('http://localhost:8080/about.html', this)" class="page-tab px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-all">
        🏛️ About Us
      </button>
      <button onclick="setPreviewUrl('http://localhost:8080/contact.html', this)" class="page-tab px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-all">
        📞 Contact &amp; Booking
      </button>
      <button onclick="setPreviewUrl('http://localhost:8080/blog.html', this)" class="page-tab px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-all">
        📰 Clinical Blog
      </button>
      <button onclick="setPreviewUrl('http://localhost:8080/instruction.html', this)" class="page-tab px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-all">
        📋 Care Guidelines
      </button>
    </nav>

    <!-- DEVICE VIEWPORT CONTROLS & URL BAR -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-3 bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3">
      <!-- Address bar simulator -->
      <div class="flex items-center gap-2.5 w-full md:w-auto flex-1">
        <button onclick="reloadIframe()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors" title="Reload Frame">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
        <div class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-300 font-mono flex items-center justify-between">
          <span id="current-url-display">http://localhost:8080/index.html</span>
          <span class="text-[10px] text-teal-400 font-sans font-semibold uppercase tracking-wider">Active</span>
        </div>
      </div>

      <!-- Device Viewport Buttons -->
      <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-lg border border-slate-800">
        <button onclick="setDevice('desktop')" id="btn-desktop" class="device-btn active px-3 py-1.5 rounded-md text-xs font-semibold bg-slate-800 text-white flex items-center gap-1.5 transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          Desktop
        </button>
        <button onclick="setDevice('tablet')" id="btn-tablet" class="device-btn px-3 py-1.5 rounded-md text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1.5 transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M12 18h.01"/></svg>
          Tablet (768px)
        </button>
        <button onclick="setDevice('mobile')" id="btn-mobile" class="device-btn px-3 py-1.5 rounded-md text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1.5 transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
          Mobile (390px)
        </button>
      </div>
    </div>

    <!-- PREVIEW FRAME CONTAINER -->
    <main class="flex justify-center transition-all duration-300 pb-8">
      <div id="device-container" class="w-full transition-all duration-300 device-shadow rounded-2xl overflow-hidden border border-slate-800 bg-slate-900" style="height: 860px;">
        <iframe
          id="preview-frame"
          src="http://localhost:8080/index.html"
          class="w-full h-full border-0 bg-slate-950"
          allow="camera; microphone; fullscreen; display-capture"
        ></iframe>
      </div>
    </main>

  </div>

  <script>
    const frame = document.getElementById('preview-frame');
    const container = document.getElementById('device-container');
    const urlDisplay = document.getElementById('current-url-display');

    function setPreviewUrl(url, btn) {
      frame.src = url;
      urlDisplay.textContent = url;
      document.querySelectorAll('.page-tab').forEach(b => {
        b.classList.remove('active', 'bg-teal-600', 'text-white');
        b.classList.add('text-slate-300', 'hover:bg-slate-800');
      });
      if (btn) {
        btn.classList.add('active', 'bg-teal-600', 'text-white');
        btn.classList.remove('text-slate-300', 'hover:bg-slate-800');
      }
    }

    function reloadIframe() {
      const current = frame.src;
      frame.src = '';
      setTimeout(() => { frame.src = current; }, 50);
    }

    function setDevice(type) {
      document.querySelectorAll('.device-btn').forEach(b => {
        b.classList.remove('active', 'bg-slate-800', 'text-white');
        b.classList.add('text-slate-400');
      });

      const btn = document.getElementById('btn-' + type);
      if (btn) {
        btn.classList.add('active', 'bg-slate-800', 'text-white');
        btn.classList.remove('text-slate-400');
      }

      if (type === 'desktop') {
        container.style.maxWidth = '100%';
        container.style.width = '100%';
        container.style.height = '860px';
      } else if (type === 'tablet') {
        container.style.maxWidth = '768px';
        container.style.width = '768px';
        container.style.height = '860px';
      } else if (type === 'mobile') {
        container.style.maxWidth = '390px';
        container.style.width = '390px';
        container.style.height = '820px';
      }
    }
  </script>
</body>
</html>
